function pill(s){let c=/Passed|Approved|Baselined|Resolved|Verified|Closed|Completed|Effective/.test(s)?'green':/Critical|Blocker|Failed|Rejected|Overdue|Reopened/.test(s)?'red':/Review|Progress|Action items|Planned|Pending|In Progress/.test(s)?'amber':'blue';return `<span class="pill ${c}">${esc(s||'Not set')}</span>`}
function dateNow(){return new Date().toISOString().slice(0,10)}
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=({overview:'Quality overview',requirements:'Requirements & baselines',reviews:'Reviews & verification',defects:'Defects & non-conformance',changes:'Change control board',metrics:'Quality metrics',release:'Release readiness gate',improve:'Corrective & preventive actions',documents:'Documents & configuration'})[p];render()}

function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records found. Add a record to begin.</td></tr>`}</tbody></table></div>`}

function stat(label,value,foot,icon){return `<div class="card"><div class="statlabel">${label}<span>${icon}</span></div><div class="statnum">${value}</div><div class="statfoot">${foot}</div></div>`}

<div class="card" style="margin-bottom:16px"><div class="cardhead"><div><h3>Quality lifecycle</h3><p>PLAN → DEFINE → EXECUTE → VERIFY → MEASURE → REPORT → IMPROVE</p></div>${pill('Live project status')}</div><div class="workflow">${[['PLAN','Quality plan','done'],['DEFINE','Baselines','done'],['EXECUTE','Build & test','done'],['VERIFY','Evidence','current'],['MEASURE','Metrics','current'],['REPORT','Release gate',''],['IMPROVE','CAPA','']].map(a=>`<div class="step ${a[2]}"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div></div>
<div class="grid dashboardgrid"><div class="card"><div class="cardhead"><div><h3>Quality objective tracking</h3><p>Current values compared with project targets</p></div><button class="secondary small" onclick="setPage('metrics')">View metrics ↗</button></div>${db.metrics.slice(0,4).map(m=>{let pct=m.unit==='defects'?Math.max(0,100-m.value*35):Math.min(100,Math.round(m.value/(m.target||1)*100));return `<div class="metricline"><div><strong>${esc(m.name)}</strong><br><small>${esc(m.note)}</small></div><strong>${m.value}${m.unit==='sec'?'s':m.unit==='%'?'%':''}</strong><div class="progress"><span style="width:${pct}%"></span></div></div>`}).join('')}</div>
<div class="card"><div class="cardhead"><div><h3>Top risk register</h3><p>Domain-specific risks requiring active control</p></div>${pill('2 high risk')}</div><div class="risklist"><div class="risk"><div class="riskicon">!</div><div><strong>Inventory race condition</strong><p>Two customers may book the same last room or seat. Require atomic reservation and concurrency testing.</p></div></div><div class="risk"><div class="riskicon">!</div><div><strong>Payment and booking mismatch</strong><p>Payment succeeds while booking remains pending. Require idempotency, reconciliation and rollback evidence.</p></div></div><div class="risk"><div class="riskicon">↻</div><div><strong>Uncontrolled requirement changes</strong><p>Unreviewed changes create inconsistent tests and late release defects. Enforce CCB approval and versioned baselines.</p></div></div></div></div></div>
<div class="card" style="margin-top:16px"><div class="cardhead"><div><h3>Recent defects</h3><p>Track transaction integrity and availability first</p></div><button class="secondary small" onclick="setPage('defects')">All defects ↗</button></div>${table(['ID / Defect','Category','Severity','Status','Owner'],db.defects.slice(0,4).map(d=>`<tr><td><strong>${esc(d.id)}</strong><div class="sub">${esc(d.title)}</div></td><td>${esc(d.category)}</td><td>${pill(d.severity)}</td><td>${pill(d.status)}</td><td>${esc(d.owner)}</td></tr>`).join(''))}</div>
<div class="footerhint">Prototype data is stored in this browser using local storage. Use Export QMS data for a backup.</div>`;
}else if(page==='requirements'){
el.innerHTML=heading('Requirements & baselines','Define measurable acceptance criteria, ownership, priority and controlled versions.',btn('＋ Add requirement',"openModal('requirements')"))+`<div class="notice"><b>Baseline policy:</b> Baseline critical business rules, inventory consistency, transaction integrity, payment security, availability targets, performance and acceptance criteria after stakeholder review. Every change after approval needs a change request, impact analysis, approval, version update and regression evidence.</div><div class="filters"><input id="search" placeholder="Search requirements..." oninput="renderTable('requirements')"><select id="filter" onchange="renderTable('requirements')"><option value="">All statuses</option>${['Draft','In Review','Baselined','Changed','Retired'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="tablehost"></div><div class="card" style="margin-top:16px"><h3>Minimum acceptance criteria</h3><ul><li>No duplicate confirmed reservation for the same inventory unit and dates.</li><li>Booking and payment state reconcile after timeout, retry, decline or callback duplication.</li><li>Availability search reflects committed reservations within the defined consistency window.</li><li>Security, privacy, accessibility and performance targets have measurable test evidence.</li><li>Every requirement links to design, test cases, defect records and release evidence.</li></ul></div>`;
renderTable('requirements');
}else if(page==='reviews'){
el.innerHTML=heading('Reviews & verification','Plan and record quality activities. Store results and link findings to defects.',btn('＋ Add activity',"openModal('reviews')"))+`<div class="notice">Required controls: requirement inspections, architecture threat/risk review, peer code review, static analysis, unit and integration tests, concurrency tests, payment failure-path tests, security tests, performance tests, UAT and regression testing. Record reviewer, build/version, evidence, result and follow-up defect.</div><div class="filters"><input id="search" placeholder="Search activities..." oninput="renderTable('reviews')"><select id="filter" onchange="renderTable('reviews')"><option value="">All statuses</option>${['Planned','In Progress','Passed','Failed','Action items','Blocked'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="tablehost"></div>`;
renderTable('reviews');
}else if(page==='defects'){
el.innerHTML=heading('Defects & non-conformance','Classify by user/business impact, not only by where the defect appeared.',btn('＋ Log defect',"openModal('defects')"))+`<div class="notice"><b>Severity guidance:</b> Blocker means release or core flow stopped. Critical means financial loss, double booking, payment mismatch, security exposure or material data corruption. Major means core feature impaired with a workaround. Minor means limited impact. Trivial means cosmetic. Priority determines repair order and is assigned separately.</div><div class="filters"><input id="search" placeholder="Search defects..." oninput="renderTable('defects')"><select id="filter" onchange="renderTable('defects')"><option value="">All statuses</option>${['Open','Triaged','In Progress','Resolved','Verified','Closed','Reopened'].map(s=>`<option>${s}</option>`).join('')}<option>Critical only</option></select></div><div id="tablehost"></div>`;
renderTable('defects');
}else if(page==='changes'){
el.innerHTML=heading('Change control board','Control requirement, design, code, test, data and release configuration changes.',btn('＋ Submit change',"openModal('changes')"))+`<div class="notice"><b>Change workflow:</b> Submit → log and classify → analyze business, technical, security, test, schedule and rollback impacts → Change Control Board (CCB) decision → update baseline and traceability → implement in a branch → review and regression test → verify → release notes and audit trail.</div><div class="grid sectiongrid"><div><div class="filters"><input id="search" placeholder="Search change requests..." oninput="renderTable('changes')"><select id="filter" onchange="renderTable('changes')"><option value="">All statuses</option>${['Submitted','Under Review','Approved','Rejected','Implemented','Verified','Closed'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="tablehost"></div></div><div class="sidepanel"><div class="card"><h3>CCB decision checklist</h3>${['Business need and acceptance criteria are clear','Inventory and payment risks assessed','Affected baselines and dependencies identified','Test impact and regression scope agreed','Security, privacy and compliance checked','Rollback and monitoring plan documented','Approver and decision recorded'].map(x=>`<div class="checkrow"><input type="checkbox"><div><strong>${x}</strong></div></div>`).join('')}</div></div></div>`;
renderTable('changes');
}else if(page==='metrics'){
el.innerHTML=heading('Quality metrics','Measure product quality, process control and release readiness.',`${btn('＋ Add CAPA',"openModal('actions')")}${btn('Export metrics CSV',"exportCSV('metrics')",'secondary')}`)+`<div class="grid stats">${stat('Traceability',db.metrics[0]?.value+'%',`Target ${db.metrics[0]?.target}%`,'↗')}${stat('Regression pass',db.metrics[1]?.value+'%',`Target ${db.metrics[1]?.target}%`,'✓')}${stat('Critical defects',db.metrics[2]?.value,`Target ${db.metrics[2]?.target}`,'⚑')}${stat('Test completion',db.metrics[5]?.value+'%',`Target ${db.metrics[5]?.target}%`,'☷')}</div><div class="grid dashboardgrid"><div class="card"><div class="cardhead"><div><h3>Metric scorecard</h3><p>Edit current values and targets for your project</p></div></div><div id="metriclist"></div></div><div class="card"><div class="cardhead"><div><h3>Test completion</h3><p>Release verification progress</p></div></div><div class="chartbars">${db.metrics.slice(0,5).map(m=>`<div class="barwrap"><span class="barvalue">${m.value}${m.unit==='%'?'%':m.unit==='sec'?'s':''}</span><div class="bar" style="height:${Math.min(100,Math.max(3,(m.unit==='defects'?m.value*20:m.value/(m.target||1)*100)))}%"></div><span class="barlabel">${esc(m.name.split(' ').slice(0,2).join(' '))}</span></div>`).join('')}</div><p class="footerhint">Metric values are prototype sample data. Replace with verified build and test evidence.</p></div></div><div class="card" style="margin-top:16px"><h3>Metric definitions</h3>${table(['Metric','How to calculate','Target rationale'],[['Requirements traceability','Requirements with linked test and evidence ÷ total approved requirements × 100','100% for release-critical requirements'],['Regression pass rate','Passed regression tests ÷ executed regression tests × 100','At least 98%, with no critical failures'],['Open critical defects','Count of unresolved blocker/critical defects','Zero'],['Availability accuracy','Correct inventory responses ÷ sampled availability responses × 100','At least 99.9%'],['P95 search response time','95th percentile search latency under agreed load','At or below 2 seconds'],['Change failure rate','Production changes causing incidents or rollback ÷ all production changes × 100','At or below 5%']].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''))}</div>`;
renderMetrics();
}else if(page==='release'){
let crit=db.defects.filter(d=>['Critical','Blocker'].includes(d.severity)&&!['Verified','Closed'].includes(d.status)).length;
let gates=[['Requirements baseline approved',db.requirements.some(r=>r.status==='Baselined'),'All critical requirements baselined and traceable'],['No open critical / blocker defects',crit===0,`${crit} unresolved critical or blocker defects`],['Regression pass rate meets target',db.metrics.some(m=>m.name==='Automated regression pass rate'&&m.value>=m.target),'Target is 98% or higher'],['Traceability meets target',db.metrics.some(m=>m.name==='Critical requirement traceability'&&m.value>=m.target),'Target is 100%'],['Test execution complete',db.metrics.some(m=>m.name==='Test execution completion'&&m.value>=m.target),'Target is 100%'],['Security and privacy sign-off',db.reviews.some(r=>/security/i.test(r.kind)&&r.status==='Passed'),'Passed security test evidence required'],['Rollback and monitoring ready',db.documents.some(d=>/release/i.test(d.title)&&['Approved','Baselined'].includes(d.status)),'Approved release plan / report required']];
let passed=gates.filter(g=>g[1]).length,ready=gates.every(g=>g[1]);
el.innerHTML=heading('Release readiness gate','Use evidence-based go / no-go decisions. Any override requires documented risk acceptance.',btn('Recalculate gate','render()','secondary'))+`<div class="grid dashboardgrid"><div class="card"><div class="cardhead"><div><h3>Release decision</h3><p>Sample release candidate: RC-0.9.0</p></div>${pill(ready?'Ready for approval':'No-Go')}</div><div class="releasebox"><div class="muted">Automated gate outcome</div><div class="releaseverdict" style="color:${ready?'var(--green)':'var(--red)'}">${ready?'PASS':'HOLD RELEASE'}</div><p>${passed} of ${gates.length} release gates currently pass. This is a prototype decision based on the records and metrics entered.</p><div class="progress"><span style="width:${passed/gates.length*100}%;background:${ready?'var(--green)':'var(--red)'}"></span></div></div><div class="footerhint">Do not release with open critical defects, failed critical tests, missing security sign-off, or unapproved baselines. Record any formally accepted residual risk.</div></div><div class="card"><h3>Required release approvals</h3>${['QA lead sign-off','Engineering lead sign-off','Product owner acceptance','Security / privacy sign-off','Release manager go/no-go'].map(x=>`<div class="checkrow"><input type="checkbox"><div><strong>${x}</strong><span>Approval checkbox is a local prototype record.</span></div></div>`).join('')}</div></div><div class="card" style="margin-top:16px"><div class="cardhead"><h3>Gate checklist</h3><span>${passed}/${gates.length} passing</span></div>${gates.map(g=>`<div class="checkrow"><span class="pill ${g[1]?'green':'red'}">${g[1]?'PASS':'FAIL'}</span><div><strong>${g[0]}</strong><span>${g[2]}</span></div></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Release decision record</h3><div class="formgrid"><div class="field"><label>Release candidate</label><input id="rcName" value="RC-0.9.0"></div><div class="field"><label>Decision</label><select id="rcDecision"><option>No-Go</option><option>Go with accepted risks</option><option>Go</option></select></div><div class="field"><label>Approver</label><input id="rcApprover" placeholder="Release manager"></div><div class="field"><label>Decision date</label><input id="rcDate" type="date" value="${dateNow()}"></div><div class="field full"><label>Evidence and risk acceptance</label><textarea id="rcNotes" placeholder="Build ID, test report links, known issues, accepted risks and rollback owner"></textarea></div></div><div class="actions" style="margin-top:12px">${btn('Save release decision',"saveRelease()")}${btn('Download release report',"downloadRelease()",'secondary')}</div><p id="releaseSaved" class="footerhint"></p></div>`;
}else if(page==='improve'){
el.innerHTML=heading('Improve & CAPA','Record root cause, corrective action, prevention and effectiveness verification.',btn('＋ New action',"openModal('actions')"))+`<div class="notice">Corrective action removes the cause of an observed non-conformance. Preventive action reduces the chance of recurrence or a similar failure elsewhere. Close actions only after evidence shows effectiveness.</div><div class="filters"><input id="search" placeholder="Search actions..." oninput="renderTable('actions')"><select id="filter" onchange="renderTable('actions')"><option value="">All statuses</option>${['Open','In Progress','Completed','Overdue'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="tablehost"></div><div class="card" style="margin-top:16px"><h3>Root-cause analysis procedure</h3><ol><li>Contain the issue and assess customer, booking, payment and data impact.</li><li>Collect logs, transaction IDs, versions, test evidence and reproduction steps.</li><li>Use 5 Whys or fishbone analysis. Identify process and design causes, not only symptoms.</li><li>Assign an owner, due date, corrective and preventive actions.</li><li>Verify the fix in a controlled build and add regression tests.</li><li>Check effectiveness after release. Update procedures and lessons learned.</li></ol></div>`;
renderTable('actions');
}else if(page==='documents'){
el.innerHTML=heading('Documents & configuration','Control the approved version of every QMS artifact and software configuration item.',btn('＋ Add document',"openModal('documents')"))+`<div class="notice">Configuration items include requirement specifications, architecture and API contracts, source code, database schema/migrations, test cases, test data, CI configuration, dependencies, deployment scripts, monitoring rules and release notes. Tag each release with source commit, build ID, dependency lockfile and test evidence.</div><div class="filters"><input id="search" placeholder="Search documents..." oninput="renderTable('documents')"><select id="filter" onchange="renderTable('documents')"><option value="">All control states</option>${['Draft','In Review','Approved','Baselined','Superseded','Archived'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="tablehost"></div><div class="grid dashboardgrid" style="margin-top:16px"><div class="card"><h3>Baseline register</h3>${table(['Baseline','Required content','Control rule'],[['BR-01 Requirements','Approved requirements, acceptance criteria, traceability','CCB approval for changes'],['BR-02 Design','Architecture, API and data model','Peer review and impact analysis'],['BR-03 Test assets','Test plan, test cases, automation and test data','Versioned with build and evidence'],['BR-04 Release','Source commit, dependency lock, build, deployment config','Immutable release tag and rollback package']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''))}</div><div class="card"><h3>Document control checklist</h3>${['Unique ID, title, owner and version','Author and independent reviewer recorded','Approval date and approver recorded','Change history and reason retained','Obsolete copies marked superseded','Traceability to release and evidence'].map(x=>`<div class="checkrow"><input type="checkbox"><div><strong>${x}</strong></div></div>`).join('')}</div></div>`;
renderTable('documents');
}}
function renderTable(type){let host=document.getElementById('tablehost');if(!host)return;let q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'';let list=db[type].filter(o=>JSON.stringify(o).toLowerCase().includes(q));if(f){if(f==='Critical only')list=list.filter(o=>['Critical','Blocker'].includes(o.severity));else list=list.filter(o=>o.status===f)}let cols={requirements:[['ID','id'],['Requirement','title'],['Type / Priority','type'],['Owner','owner'],['Version','version'],['Status','status']],reviews:[['ID','id'],['Activity','title'],['Type','kind'],['Owner','owner'],['Date','date'],['Coverage','coverage'],['Status','status']],defects:[['ID / Defect','id'],['Category','category'],['Severity / Priority','severity'],['Status','status'],['Owner','owner'],['Related requirement','req']],changes:[['ID / Change','id'],['Impact','impact'],['Baseline','baseline'],['Requester','requester'],['CCB decision','decision'],['Status','status'],['Date','date']],actions:[['ID / Action','id'],['Source','source'],['Owner','owner'],['Due','due'],['Type','kind'],['Effectiveness','effectiveness'],['Status','status']],documents:[['ID / Document','id'],['Type','kind'],['Version','version'],['Owner','owner'],['Last review','date'],['Control status','status']]};let rows=list.map(o=>`<tr>${cols[type].map(([label,k])=>`<td>${k==='status'||k==='severity'||k==='decision'||k==='effectiveness'?pill(o[k]):k==='title'?`<strong>${esc(o.id)}</strong><div class="sub">${esc(o[k])}</div>`:esc(o[k]||'Not linked')}</td>`).join('')}<td>${actions(type,o.id)}</td></tr>`).join('');host.innerHTML=table([...cols[type].map(c=>c[0]),'Actions'],rows)}
function openModal(type,id=null){modalType=type;editingId=id;let o=id?db[type].find(x=>x.id===id):{};document.getElementById('modalTitle').textContent=(id?'Edit ':'Add ')+defs[type].title;document.getElementById('formFields').innerHTML=defs[type].fields.map(([key,label,kind,opts])=>{let val=o[key]|| (key==='date'||key==='due'?dateNow():'');let input=kind==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:kind==='select'?`<select name="${key}">${opts.split('|').map(v=>`<option ${v===val?'selected':''}>${v}</option>`).join('')}</select>`:`<input name="${key}" type="${kind}" value="${esc(val)}" ${['title','owner'].includes(key)?'required':''}>`;return `<div class="field ${kind==='textarea'?'full':''}"><label>${label}</label>${input}</div>`}).join('');document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
document.getElementById('recordForm').addEventListener('submit',e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(editingId){let i=db[modalType].findIndex(x=>x.id===editingId);db[modalType][i]={...db[modalType][i],...data}}else{let prefix={requirements:'REQ',reviews:'REV',defects:'DEF',changes:'CR',actions:'CAPA',documents:'DOC'}[modalType];let next=db[modalType].length+1;data.id=prefix+'-'+String(next).padStart(3,'0');if(modalType==='changes'){data.decision=data.decision||'Pending'}db[modalType].unshift(data)}save();closeModal();render()});
function editRecord(t,id){openModal(t,id)}
function deleteRecord(t,id){if(confirm('Delete '+id+'? This action changes your local prototype data.')){db[t]=db[t].filter(x=>x.id!==id);save();render()}}
function renderMetrics(){let host=document.getElementById('metriclist');if(!host)return;host.innerHTML=db.metrics.map((m,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><strong style="font-size:12px">${esc(m.name)}</strong><button class="secondary small" onclick="editMetric(${i})">Edit</button></div><div class="sub">${esc(m.note)}</div><div class="formgrid" style="margin-top:9px"><div><label>Current value (${m.unit})</label><input type="number" step="0.1" id="mv${i}" value="${m.value}"></div><div><label>Target (${m.unit})</label><input type="number" step="0.1" id="mt${i}" value="${m.target}"></div></div></div>`).join('')+`<div style="margin-top:14px">${btn('Save metric values','saveMetrics()')}</div>`}
function saveMetrics(){db.metrics.forEach((m,i)=>{m.value=Number(document.getElementById('mv'+i).value);m.target=Number(document.getElementById('mt'+i).value)});save();render()}
function editMetric(i){const m=db.metrics[i];const v=prompt('Enter current value for '+m.name,m.value);if(v===null||v.trim()==='')return;const t=prompt('Enter target value',m.target);if(t===null||t.trim()==='')return;m.value=Number(v);m.target=Number(t);save();render()}
function exportJSON(){download('qualityos-team7-data.json',JSON.stringify({project:'Team 7 Hotel and Travel Booking QMS',exportedAt:new Date().toISOString(),data:db},null,2),'application/json')}
function exportCSV(type){let rows=db[type],keys=Object.keys(rows[0]||{});let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');download('qualityos-'+type+'.csv',csv,'text/csv')}
function download(name,content,mime){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function saveRelease(){let r={candidate:document.getElementById('rcName').value,decision:document.getElementById('rcDecision').value,approver:document.getElementById('rcApprover').value,date:document.getElementById('rcDate').value,notes:document.getElementById('rcNotes').value,gate:document.querySelector('.releaseverdict')?.textContent||'Not calculated'};db.releaseDecision=r;save();document.getElementById('releaseSaved').textContent='Release decision saved locally: '+r.candidate+' · '+r.decision}
function downloadRelease(){let r=db.releaseDecision||{candidate:document.getElementById('rcName')?.value||'RC-0.9.0',decision:document.getElementById('rcDecision')?.value||'No-Go',approver:document.getElementById('rcApprover')?.value||'',date:document.getElementById('rcDate')?.value||dateNow(),notes:document.getElementById('rcNotes')?.value||''};download('team7-release-readiness.json',JSON.stringify({release:r,metrics:db.metrics,defects:db.defects,requirements:db.requirements,reviews:db.reviews},null,2),'application/json')}
render();
</script></body></html>
